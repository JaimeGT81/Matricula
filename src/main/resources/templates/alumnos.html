<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumno - Sistema de Matrícula</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
<div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <div class="flex flex-col space-y-6">
        <!-- Título principal -->
        <div class="text-center">
            <h1 class="text-5xl font-bold text-gray-800 mb-2">Gestión de Alumnos</h1>
        </div>

        <!-- Botón Atrás -->
        <div class="flex justify-start">
            <a th:href="@{/inicio}" class="px-4 py-2 bg-gray-500 text-white rounded-lg shadow hover:bg-gray-600 transition flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Atrás
            </a>
        </div>

        <!-- Barra de búsqueda y botones -->
        <div class="bg-white p-4 rounded-lg shadow border border-gray-200">
            <form method="GET" th:action="@{/alumnos}" class="flex flex-col md:flex-row gap-4 items-end">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">DNI</label>
                        <input type="text" name="dni" placeholder="Buscar por DNI" th:value="${param.dni}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombres</label>
                        <input type="text" name="nombres" placeholder="Buscar por nombres" th:value="${param.nombres}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
                        <input type="text" name="apellidos" placeholder="Buscar por apellidos" th:value="${param.apellidos}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                    </div>
                </div>

                <div class="flex space-x-3">
                    <button type="submit"
                            class="px-6 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition whitespace-nowrap flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        Buscar
                    </button>

                    <button type="button" onclick="document.getElementById('miModal').classList.remove('hidden')"
                            class="px-6 py-2 bg-green-600 text-white rounded-lg shadow hover:bg-green-700 transition whitespace-nowrap flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                        Nuevo
                    </button>

                    <a th:href="@{/alumnos}" type="button"
                       class="px-6 py-2 bg-yellow-500 text-white rounded-lg shadow hover:bg-yellow-600 transition whitespace-nowrap flex items-center">
                        <svg class="h-5 w-5 mr-2" fill="#ffffff" height="14px" width="14px" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 489.533 489.533" xml:space="preserve"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g> <path d="M268.175,488.161c98.2-11,176.9-89.5,188.1-187.7c14.7-128.4-85.1-237.7-210.2-239.1v-57.6c0-3.2-4-4.9-6.7-2.9 l-118.6,87.1c-2,1.5-2,4.4,0,5.9l118.6,87.1c2.7,2,6.7,0.2,6.7-2.9v-57.5c87.9,1.4,158.3,76.2,152.3,165.6 c-5.1,76.9-67.8,139.3-144.7,144.2c-81.5,5.2-150.8-53-163.2-130c-2.3-14.3-14.8-24.7-29.2-24.7c-17.9,0-31.9,15.9-29.1,33.6 C49.575,418.961,150.875,501.261,268.175,488.161z"></path> </g> </g></svg>
                        Refrescar
                    </a>
                </div>
            </form>
        </div>

        <!-- Modal Nuevo Alumno -->
        <div id="miModal" class="fixed inset-0 flex items-center justify-center bg-black/50 hidden z-50 overflow-y-auto">
            <div class="bg-white rounded-lg shadow-lg w-11/12 md:w-3/4 lg:w-2/3 xl:w-1/2 p-6 relative my-8 max-h-[90vh] overflow-y-auto">
                <h2 class="text-xl font-bold mb-4">Nuevo Alumno</h2>
                <form th:action="@{/alumnos}" th:object="${newAlumno}" method="POST"
                      class="space-y-4 grid grid-cols-1 md:grid-cols-2 gap-4">

                    <!-- Columna Izquierda -->
                    <div class="space-y-4">
                        <div>
                            <label for="dniAlum" class="block text-sm font-medium text-gray-700">DNI:</label>
                            <input type="text" id="dniAlum" th:field="*{dniAlum}" required
                                   class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                        </div>

                        <div>
                            <label for="nombres" class="block text-sm font-medium text-gray-700">Nombres:</label>
                            <input type="text" id="nombres" th:field="*{nombres}" required
                                   class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                        </div>

                        <div>
                            <label for="apellidos" class="block text-sm font-medium text-gray-700">Apellidos:</label>
                            <input type="text" id="apellidos" th:field="*{apellidos}" required
                                   class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                        </div>
                    </div>

                    <!-- Columna Derecha -->
                    <div class="space-y-4">
                        <div>
                            <label for="genero" class="block text-sm font-medium text-gray-700">Género:</label>
                            <select id="genero" th:field="*{genero}" required
                                    class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                                <option value="" disabled selected>Seleccione</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>

                        <div>
                            <label for="idUbigeo" class="block text-sm font-medium text-gray-700">Ubigeo:</label>
                            <select id="idUbigeo" th:field="*{ubigeo.idUbigeo}" required
                                    class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                                <option value="" disabled selected>Seleccione</option>
                                <option th:each="u : ${ubigeos}" th:value="${u.idUbigeo}"
                                        th:text="${u.departamento + ' - ' + u.provincia + ' - ' + u.distrito}">
                                </option>
                            </select>
                        </div>

                        <div>
                            <label for="codigoCarrera" class="block text-sm font-medium text-gray-700">Código Carrera:</label>
                            <input type="number" id="codigoCarrera" th:field="*{codigoCarrera}"
                                   class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                        </div>
                    </div>

                    <div class="col-span-full flex justify-end space-x-4 pt-4 border-t border-gray-200">
                        <button type="submit"
                                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                            Crear
                        </button>
                        <button type="button" onclick="document.getElementById('miModal').classList.add('hidden')"
                                class="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition">
                            Cerrar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de Alumnos -->
        <div class="bg-white shadow-lg rounded-xl overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">DNI</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombres</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Apellidos</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Género</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Código Carrera</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ubigeo</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha Registro</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Usuario Registro</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha Última Modificación</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Usuario Última Modificación</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                    </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="alumno : ${alumnos.content}" class="hover:bg-gray-50 transition duration-150 ease-in-out">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${alumno.dniAlum}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${alumno.nombres}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${alumno.apellidos}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${alumno.genero}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${alumno.codigoCarrera}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
                            th:text="${alumno.ubigeo.idDepa+''+alumno.ubigeo.idProv+''+alumno.ubigeo.idDist}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${#temporals.format(alumno.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${alumno.usuarioRegistro}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
                            th:text="${#temporals.format(alumno.fechaUltModificacion, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${alumno.usuarioUltModificacion}"></td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span th:classappend="${alumno.activo} ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
                                  class="px-2.5 py-0.5 rounded-full text-xs font-medium">
                                <span th:text="${alumno.activo} ? 'Activo':'Inactivo'"></span>
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <div class="flex items-center space-x-2">
                                <button
                                        th:attr="onclick=|document.getElementById('modalEditar${alumno.dniAlum}').classList.remove('hidden')|"
                                        class="inline-flex items-center px-3 py-1.5 border border-yellow-500 shadow-sm text-xs font-medium rounded-md text-yellow-700 bg-white hover:bg-yellow-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500">
                                    Editar
                                </button>

                                <form th:action="@{/alumnos/eliminar/{dni}(dni=${alumno.dniAlum})}" method="post"
                                      onsubmit="return confirm('¿Deseas eliminar este alumno?');" class="inline">
                                    <button type="submit"
                                            class="inline-flex items-center px-3 py-1.5 border border-red-500 shadow-sm text-xs font-medium rounded-md text-red-700 bg-white hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                                        Eliminar
                                    </button>
                                </form>
                            </div>

                            <!-- Modal Editar Alumno -->
                            <div th:id="'modalEditar' + ${alumno.dniAlum}" class="fixed inset-0 flex items-center justify-center bg-black/50 hidden z-50 overflow-y-auto">
                                <div class="bg-white rounded-lg shadow-lg w-11/12 md:w-3/4 lg:w-2/3 xl:w-1/2 p-6 relative my-8 max-h-[90vh] overflow-y-auto">
                                    <h2 class="text-xl font-bold mb-4" th:text="'Editar Alumno ' + ${alumno.dniAlum}"></h2>

                                    <form th:action="@{/alumnos/editar/{dni}(dni=${alumno.dniAlum})}" th:object="${newAlumno}" method="post"
                                          class="space-y-4 grid grid-cols-1 md:grid-cols-2 gap-4">

                                        <!-- Columna Izquierda -->
                                        <div class="space-y-4">
                                            <div>
                                                <label for="nombres" class="block text-sm font-medium text-gray-700">Nombres:</label>
                                                <input type="text" id="nombres" name="nombres" th:value="${alumno.nombres}"
                                                       class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" required />
                                            </div>

                                            <div>
                                                <label for="apellidos" class="block text-sm font-medium text-gray-700">Apellidos:</label>
                                                <input type="text" id="apellidos" name="apellidos" th:value="${alumno.apellidos}"
                                                       class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" required />
                                            </div>

                                            <div>
                                                <label for="genero" class="block text-sm font-medium text-gray-700">Género:</label>
                                                <select id="genero" name="genero"
                                                        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" required>
                                                    <option value="" th:selected="${alumno.genero == null}">Seleccione</option>
                                                    <option value="Masculino" th:selected="${alumno.genero == 'Masculino'}">Masculino</option>
                                                    <option value="Femenino" th:selected="${alumno.genero == 'Femenino'}">Femenino</option>
                                                    <option value="Otro" th:selected="${alumno.genero == 'Otro'}">Otro</option>
                                                </select>
                                            </div>
                                        </div>

                                        <!-- Columna Derecha -->
                                        <div class="space-y-4">
                                            <div>
                                                <label for="idUbigeo" class="block text-sm font-medium text-gray-700">Ubigeo:</label>
                                                <select id="idUbigeo" name="ubigeo.idUbigeo"
                                                        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" required>
                                                    <option value="" th:selected="${alumno.ubigeo == null}">Seleccione</option>
                                                    <option th:each="u : ${ubigeos}" th:value="${u.idUbigeo}"
                                                            th:text="${u.departamento + ' - ' + u.provincia + ' - ' + u.distrito}"
                                                            th:selected="${alumno.ubigeo != null} ? ${u.idUbigeo} == ${alumno.ubigeo.idUbigeo} : false">
                                                    </option>
                                                </select>
                                            </div>

                                            <div>
                                                <label for="codigoCarrera" class="block text-sm font-medium text-gray-700">Código Carrera:</label>
                                                <input type="number" id="codigoCarrera" name="codigoCarrera" th:value="${alumno.codigoCarrera}"
                                                       class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                                            </div>
                                        </div>

                                        <div class="col-span-full flex justify-end space-x-4 pt-4 border-t border-gray-200">
                                            <button type="submit"
                                                    class="px-4 py-2 bg-yellow-500 text-white rounded-md hover:bg-yellow-600 transition">
                                                Guardar Cambios
                                            </button>
                                            <button type="button" th:attr="onclick=|document.getElementById('modalEditar${alumno.dniAlum}').classList.add('hidden')|"
                                                    class="px-4 py-2 bg-gray-400 text-white rounded-md hover:bg-gray-500 transition">
                                                Cancelar
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Paginación -->
        <div class="flex justify-center">
            <nav class="flex justify-end">
                <ul class="inline-flex -space-x-px text-sm">
                    <li th:if="${currentPage > 0}">
                        <a th:href="@{/alumnos(page=${currentPage - 1}, size=10)}"
                           class="px-3 py-2 ml-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100 hover:text-gray-700">
                            Anterior
                        </a>
                    </li>

                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                        <a th:href="@{/alumnos(page=${i}, size=10)}"
                           th:classappend="${i == currentPage} ? 'text-blue-600 bg-blue-100 hover:bg-blue-200 hover:text-blue-700' : 'text-gray-500 bg-white hover:bg-gray-100 hover:text-gray-700'"
                           class="px-3 py-2 leading-tight border border-gray-300">
                            <span th:text="${i + 1}"></span>
                        </a>
                    </li>

                    <li th:if="${currentPage < totalPages - 1}">
                        <a th:href="@{/alumnos(page=${currentPage + 1}, size=10)}"
                           class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100 hover:text-gray-700">
                            Siguiente
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
