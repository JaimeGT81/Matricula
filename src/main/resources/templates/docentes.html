<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docente - Sistema de Matrícula</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
<div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <div class="flex flex-col space-y-6">
        <!-- Título principal -->
        <div class="text-center">
            <h1 class="text-5xl font-bold text-gray-800 mb-2">Gestión de Docentes</h1>
        </div>

        <!-- Barra de búsqueda y botones -->
        <div class="bg-white p-4 rounded-lg shadow border border-gray-200">
            <form method="GET" th:action="@{/docentes}" class="flex flex-col md:flex-row gap-4 items-end">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">DNI</label>
                        <input type="text" name="dni" placeholder="Buscar por DNI" th:value="${param.dni}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombres</label>
                        <input type="text" name="nombre" placeholder="Buscar por nombres" th:value="${param.nombre}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
                        <input type="text" name="apellido" placeholder="Buscar por apellidos" th:value="${param.apellido}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                    </div>
                </div>

                <div class="flex space-x-3">
                    <button type="submit"
                            class="px-6 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition whitespace-nowrap flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        Buscar
                    </button>

                    <button type="button" onclick="document.getElementById('miModal').classList.remove('hidden')"
                            class="px-6 py-2 bg-green-600 text-white rounded-lg shadow hover:bg-green-700 transition whitespace-nowrap flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                        Nuevo
                    </button>

                    <a th:href="@{/docentes}" type="button"
                            class="px-6 py-2 bg-yellow-500 text-white rounded-lg shadow hover:bg-yellow-600 transition whitespace-nowrap flex items-center">
                        <svg class="h-5 w-5 mr-2" fill="#ffffff" height="14px" width="14px" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 489.533 489.533" xml:space="preserve"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g> <path d="M268.175,488.161c98.2-11,176.9-89.5,188.1-187.7c14.7-128.4-85.1-237.7-210.2-239.1v-57.6c0-3.2-4-4.9-6.7-2.9 l-118.6,87.1c-2,1.5-2,4.4,0,5.9l118.6,87.1c2.7,2,6.7,0.2,6.7-2.9v-57.5c87.9,1.4,158.3,76.2,152.3,165.6 c-5.1,76.9-67.8,139.3-144.7,144.2c-81.5,5.2-150.8-53-163.2-130c-2.3-14.3-14.8-24.7-29.2-24.7c-17.9,0-31.9,15.9-29.1,33.6 C49.575,418.961,150.875,501.261,268.175,488.161z"></path> </g> </g></svg>
                        Refrescar
                    </a>
                </div>
            </form>
        </div>

    <!-- Modal Nuevo Docente -->
    <div id="miModal" class="fixed inset-0 flex items-center justify-center bg-black/50 hidden z-50 overflow-y-auto">
        <div class="bg-white rounded-lg shadow-lg w-11/12 md:w-3/4 lg:w-2/3 xl:w-1/2 p-6 relative my-8 max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold mb-4">Nuevo Docente</h2>
            <form th:action="@{/docentes}" th:object="${newDocente}" method="POST" enctype="multipart/form-data"
                  class="space-y-4 grid grid-cols-1 md:grid-cols-2 gap-4">

                <!-- Columna Izquierda -->
                <div class="space-y-4">
                    <!-- Campo de imagen para vista previa -->
                    <div class="flex flex-col items-center">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Foto del Docente</label>
                        <!-- Vista previa de la imagen -->
                        <div class="w-32 h-32 rounded-full bg-gray-200 mb-2 overflow-hidden border-2 border-gray-300 flex items-center justify-center">
                            <img id="imgNuevo" th:src="@{/images/user.png}" alt="Preview" class="w-full h-full object-cover img-preview"/>
                        </div>
                        <!-- Input para seleccionar imagen -->
                        <input type="file" th:field="*{fotoNueva}" id="fotoNueva" name="foto" accept="image/png image/jpeg"
                               class="block w-full text-sm text-gray-500
                                      file:mr-4 file:py-2 file:px-4
                                      file:rounded-md file:border-0
                                      file:text-sm file:font-semibold
                                      file:bg-blue-50 file:text-blue-700
                                      hover:file:bg-blue-100 file-input">
                        <p class="mt-1 text-xs text-gray-500">Formatos: JPG, PNG (Max. 2MB)</p>
                    </div>

                    <div>
                        <label for="dni" class="block text-sm font-medium text-gray-700">DNI:</label>
                        <input type="text" id="dni" th:field="*{dni}" minlength="8" maxlength="8" required
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                    </div>

                    <div>
                        <label for="nombre" class="block text-sm font-medium text-gray-700">Nombres:</label>
                        <input type="text" id="nombre" th:field="*{nombre}" required
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                    </div>

                    <div>
                        <label for="apellido" class="block text-sm font-medium text-gray-700">Apellidos:</label>
                        <input type="text" id="apellido" th:field="*{apellido}" required
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                    </div>

                    <div>
                        <label for="genero" class="block text-sm font-medium text-gray-700">Género:</label>
                        <select id="genero" th:field="*{genero}" required
                                class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                            <option value="" disabled selected>Seleccione</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Femenino">Femenino</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                </div>

                <!-- Columna Derecha -->
                <div class="space-y-4">
                    <div>
                        <label for="fecha_nacimiento" class="block text-sm font-medium text-gray-700">Fecha de Nacimiento:</label>
                        <input type="date" id="fecha_nacimiento" th:field="*{fechaNacimiento}" required
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                    </div>

                    <div>
                        <label for="celular" class="block text-sm font-medium text-gray-700">Celular:</label>
                        <input type="tel" id="celular" th:field="*{celular}" minlength="9" maxlength="9" required
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                    </div>

                    <div>
                        <label for="ubigeo" class="block text-sm font-medium text-gray-700">Ubigeo:</label>
                        <select id="ubigeo" th:field="*{ubigeo}" required
                                class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                            <option value="" disabled selected>Seleccione</option>
                            <option th:each="u : ${ubigeos}" th:value="${u.idUbigeo}"
                                    th:text="${u.departamento + ' - ' + u.provincia + ' - ' + u.distrito}">
                            </option>
                        </select>
                    </div>

                    <div>
                        <label for="carrera" class="block text-sm font-medium text-gray-700">Carreras:</label>
                        <select id="carrera" th:field="*{carreraId}" required
                                class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                            <option value="" disabled selected>Seleccione</option>
                            <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.nombre}"> </option>
                        </select>
                    </div>

                    <div>
                        <label for="direccion" class="block text-sm font-medium text-gray-700">Dirección:</label>
                        <input type="text" id="direccion" th:field="*{direccion}" required
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                    </div>
                </div>

                <div class="col-span-full flex justify-end space-x-4 pt-4 border-t border-gray-200">
                    <button type="submit"
                            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                        Crear
                    </button>
                    <button type="button" onclick="document.getElementById('miModal').classList.add('hidden')"
                            class="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition">
                        Cerrar
                    </button>
                </div>
            </form>
        </div>
    </div>

        <div class="bg-white shadow-lg rounded-xl overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">DNI</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Apellido</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Celular</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dirección</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Carrera</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                    </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="docente : ${docentes.content}" class="hover:bg-gray-50 transition duration-150 ease-in-out">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${docente.dni}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${docente.nombre}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${docente.apellido}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${docente.celular}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${docente.direccion}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${docente.carreraNombre}"></td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span th:classappend="${docente.estado} ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
                                  class="px-2.5 py-0.5 rounded-full text-xs font-medium">
                                <span th:text="${docente.estado} ? 'Activo':'Inactivo'"></span>
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <div class="flex items-center space-x-2">
                                <button
                                        th:attr="onclick=|document.getElementById('modalEditar${docente.dni}').classList.remove('hidden')|"
                                        class="inline-flex items-center px-3 py-1.5 border border-yellow-500 shadow-sm text-xs font-medium rounded-md text-yellow-700 bg-white hover:bg-yellow-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500">
                                    Editar
                                </button>

                                <!-- Modal Editar Docente -->
                                <div th:id="'modalEditar' + ${docente.dni}" class="fixed inset-0 flex items-center justify-center bg-black/50 hidden z-50 overflow-y-auto">
                                    <div class="bg-white rounded-lg shadow-lg w-11/12 md:w-3/4 lg:w-2/3 xl:w-1/2 p-6 relative my-8 max-h-[90vh] overflow-y-auto">
                                        <h2 class="text-xl font-bold mb-4" th:text="'Editar Docente ' + ${docente.dni}"></h2>

                                        <form th:action="@{/docentes/editar/{dni}(dni=${docente.dni})}" th:object="${newDocente}" method="post" enctype="multipart/form-data" class="space-y-4 grid grid-cols-1 md:grid-cols-2 gap-4">

                                            <!-- Columna Izquierda -->
                                            <div class="space-y-4">
                                                <!-- Campo de imagen para vista previa -->
                                                <div class="flex flex-col items-center">
                                                    <label class="block text-sm font-medium text-gray-700 mb-2">Foto del Docente</label>
                                                    <div class="w-32 h-32 rounded-full bg-gray-200 mb-2 overflow-hidden border-2 border-gray-300 flex items-center justify-center">
                                                        <!-- Vista previa de la imagen -->
                                                        <img class="img-preview w-full h-full object-cover" th:src="${docente.fotoActual != null && docente.fotoActual != ''} ? @{/fotos/docente/{nombre}(nombre=${docente.fotoActual})} : @{/images/user.png}" alt="Preview" />
                                                    </div>
                                                    <!-- Input oculto para guardar el valor de la foto actual en caso se edite y poder eliminarla -->
                                                    <input type="hidden" id="fotoActual" name="fotoActual" th:value="${docente.fotoActual}">
                                                    <!-- Input para seleccionar imagen -->
                                                    <input type="file" id="foto_editar" name="fotoNueva" accept="image/png img/jpeg"
                                                           class="block w-full text-sm text-gray-500
                                                              file:mr-4 file:py-2 file:px-4
                                                              file:rounded-md file:border-0
                                                              file:text-sm file:font-semibold
                                                              file:bg-blue-50 file:text-blue-700
                                                              hover:file:bg-blue-100 file-input">
                                                    <p class="mt-1 text-xs text-gray-500">Formatos: JPG, PNG (Max. 2MB)</p>
                                                </div>

                                                <div>
                                                    <label for="nombre_editar" class="block text-sm font-medium text-gray-700">Nombre:</label>
                                                    <input type="text" id="nombre_editar" name="nombre" th:value="${docente.nombre}"
                                                           class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"/>
                                                </div>

                                                <div>
                                                    <label for="apellido_editar" class="block text-sm font-medium text-gray-700">Apellido:</label>
                                                    <input type="text" id="apellido_editar" name="apellido" th:value="${docente.apellido}"
                                                           class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"/>
                                                </div>

                                                <div>
                                                    <label for="genero_editar" class="block text-sm font-medium text-gray-700">Género:</label>
                                                    <select id="genero_editar" name="genero"
                                                            class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                                                        <option value="" th:selected="${docente.genero == null}">Seleccione</option>
                                                        <option value="Masculino" th:selected="${docente.genero == 'Masculino'}">Masculino</option>
                                                        <option value="Femenino" th:selected="${docente.genero == 'Femenino'}">Femenino</option>
                                                        <option value="Otro" th:selected="${docente.genero == 'Otro'}">Otro</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <!-- Columna Derecha -->
                                            <div class="space-y-4">
                                                <div>
                                                    <label for="fecha_nacimiento_editar" class="block text-sm font-medium text-gray-700">Fecha de Nacimiento:</label>
                                                    <input type="date" id="fecha_nacimiento_editar" name="fechaNacimiento" th:value="${docente.fechaNacimiento}"
                                                           class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                                                </div>

                                                <div>
                                                    <label for="celular_editar" class="block text-sm font-medium text-gray-700">Celular:</label>
                                                    <input type="tel" id="celular_editar" name="celular" th:value="${docente.celular}" minlength="9" maxlength="9"
                                                           class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                                                </div>

                                                <div>
                                                    <label for="ubigeo_editar" class="block text-sm font-medium text-gray-700">Ubigeo:</label>
                                                    <select id="ubigeo_editar" name="ubigeo"
                                                            class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                                                        <option value="" th:selected="${docente.ubigeo == null}">Seleccione</option>
                                                        <option th:each="u : ${ubigeos}" th:value="${u.idUbigeo}"
                                                                th:text="${u.departamento + ' - ' + u.provincia + ' - ' + u.distrito}"
                                                                th:selected="${docente.ubigeo != null} ? ${u.idUbigeo} == ${docente.ubigeo} : false">
                                                        </option>
                                                    </select>
                                                </div>

                                                <div>
                                                    <label for="carrera_editar" class="block text-sm font-medium text-gray-700">Carrera:</label>
                                                    <select id="carrera_editar" name="carreraId"
                                                            class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                                                        <option value="" th:selected="${docente.carreraId == null}">Seleccione</option>
                                                        <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.nombre}"
                                                                th:selected="${docente.carreraId != null} ? ${docente.carreraId} == ${c.id} : false">
                                                        </option>
                                                    </select>
                                                </div>

                                                <div>
                                                    <label for="direccion_editar" class="block text-sm font-medium text-gray-700">Dirección:</label>
                                                    <input type="text" id="direccion_editar" name="direccion" th:value="${docente.direccion}"
                                                           class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
                                                </div>
                                            </div>

                                            <!-- Campos de solo lectura -->
                                            <div class="col-span-full space-y-4 border-t border-gray-200 pt-4">
                                                <div>
                                                    <label for="fecha_registro" class="block text-sm font-medium text-gray-700">Fecha de Registro:</label>
                                                    <input type="text" id="fecha_registro" name="fechaRegistro" th:value="${docente.fechaRegistro}" readonly
                                                           class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 bg-gray-100" />
                                                </div>

                                                <div>
                                                    <label for="usuario" class="block text-sm font-medium text-gray-700">Usuario:</label>
                                                    <input type="text" id="usuario" name="usuarioRegistro" th:value="${docente.usuarioRegistro}" readonly
                                                           class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 bg-gray-100" />
                                                </div>

                                                <div>
                                                    <div class="flex items-center">
                                                        <label for="estado" class="ml-2 block text-sm font-medium text-gray-700">Estado:</label>
                                                        <input type="checkbox" id="estado" name="estado"
                                                               th:checked="${docente != null} ? ${docente.estado} : true"
                                                               class="h-4 w-4 text-blue-600 border-gray-300 ml-2 rounded" />
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Botones -->
                                            <div class="col-span-full flex justify-end space-x-4 pt-4 border-t border-gray-200">
                                                <button type="submit"
                                                        class="px-4 py-2 bg-yellow-500 text-white rounded-md hover:bg-yellow-600 transition">
                                                    Guardar Cambios
                                                </button>
                                                <button type="button" th:attr="onclick=|document.getElementById('modalEditar${docente.dni}').classList.add('hidden')|"
                                                        class="px-4 py-2 bg-gray-400 text-white rounded-md hover:bg-gray-500 transition">
                                                    Cancelar
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                                <form th:action="@{/docentes/eliminar/{dni}(dni=${docente.dni})}" method="post"
                                      onsubmit="return confirm('¿Deseas eliminar este docente?');">
                                    <button type="submit"
                                            class="inline-flex items-center px-3 py-1.5 border border-red-500 shadow-sm text-xs font-medium rounded-md text-red-700 bg-white hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                                        Eliminar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Contenedor de paginación -->
        <div class="flex items-center">
            <div class="mr-auto">
                <a th:href="@{/inicio}" class="px-4 py-2 bg-gray-500 text-white rounded-lg shadow hover:bg-gray-600 transition flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Atrás
                </a>
            </div>

            <div class="absolute left-1/2 transform -translate-x-1/2">
                <nav class="inline-flex rounded-md shadow-sm -space-x-px">
                    <ul class="inline-flex -space-x-px text-sm">
                        <li th:if="${currentPage > 0}">
                            <a th:href="@{/docentes(page=${currentPage - 1}, size=8, dni=${dni}, nombre=${nombre}, apellido=${apellido})}"
                               class="px-3 py-2 ml-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100 hover:text-gray-700">
                                Anterior
                            </a>
                        </li>

                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                            <a th:href="@{/docentes(page=${i}, size=8, dni=${dni}, nombre=${nombre}, apellido=${apellido})}"
                               th:classappend="${i == currentPage} ? 'text-blue-600 bg-blue-100 hover:bg-blue-200 hover:text-blue-700' : 'text-gray-500 bg-white hover:bg-gray-100 hover:text-gray-700'"
                               class="px-3 py-2 leading-tight border border-gray-300">
                                <span th:text="${i + 1}"></span>
                            </a>
                        </li>

                        <li th:if="${currentPage < totalPages - 1}">
                            <a th:href="@{/docentes(page=${currentPage + 1}, size=8, dni=${dni}, nombre=${nombre}, apellido=${apellido})}"
                               class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100 hover:text-gray-700">
                                Siguiente
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/image-preview.js}"></script>
</body>
</html>
