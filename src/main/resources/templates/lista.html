<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes - Sistema de Matrícula</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.2.3/css/buttons.dataTables.min.css">
</head>
<body>
<div class="container">
    <h2>Reportes Disponibles</h2>
    <div class="table-responsive">
        <table id="reportesTable" class="display">
            <thead>
            <tr>
                <th>Nombre del Reporte</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>Resumen de Alumnos</td>
                <td>
                    <button onclick="mostrarResumenAlumnos()" class="btn-primary">Ver Reporte</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="resumenModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Resumen de Alumnos</h3>

            <!-- Botones de exportación -->
            <div class="export-buttons" style="margin-bottom: 15px;">
                <button onclick="exportarExcel()" class="btn-success">
                    📊 Exportar a Excel
                </button>
                <button onclick="exportarPDF()" class="btn-danger">
                    📄 Exportar a PDF
                </button>
            </div>

            <div class="table-responsive">
                <table id="resumenAlumnosTable" class="display">
                    <thead>
                    <tr>
                        <th>DNI</th>
                        <th>Nombres</th>
                        <th>Carrera</th>
                        <th>Secciones</th>
                        <th>Cuotas</th>
                        <th>Pagos</th>
                    </tr>
                    </thead>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.3/js/dataTables.buttons.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.3/js/buttons.html5.min.js"></script>
<script th:inline="javascript">
    let resumenTable;

    function mostrarResumenAlumnos() {
        if (!resumenTable) {
            resumenTable = $('#resumenAlumnosTable').DataTable({
                ajax: {
                    url: '/reportes/alumnos-resumen',
                    dataSrc: ''
                },
                columns: [
                    {data: 'dni'},
                    {data: 'nombres'},
                    {data: 'carrera'},
                    {data: 'secciones'},
                    {data: 'cuotas'},
                    {data: 'pagos'}
                ],
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'excel',
                        text: 'Excel',
                        className: 'btn-export-excel',
                        title: 'Resumen de Alumnos',
                        filename: 'resumen_alumnos_' + new Date().toISOString().split('T')[0]
                    },
                    {
                        extend: 'pdf',
                        text: 'PDF',
                        className: 'btn-export-pdf',
                        title: 'Resumen de Alumnos',
                        filename: 'resumen_alumnos_' + new Date().toISOString().split('T')[0],
                        orientation: 'landscape',
                        pageSize: 'A4'
                    }
                ]
            });
        } else {
            resumenTable.ajax.reload();
        }
        $('#resumenModal').show();
    }

    function exportarExcel() {
        if (resumenTable) {
            resumenTable.button('.btn-export-excel').trigger();
        } else {
            alert('Por favor, carga el reporte primero');
        }
    }

    function exportarPDF() {
        if (resumenTable) {
            resumenTable.button('.btn-export-pdf').trigger();
        } else {
            alert('Por favor, carga el reporte primero');
        }
    }

    $('.close').click(() => $('#resumenModal').hide());
    $(window).click(e => {
        if ($(e.target).is('#resumenModal')) {
            $('#resumenModal').hide();
        }
    });
</script>

<style>
    .export-buttons {
        text-align: right;
        margin-bottom: 15px;
    }

    .btn-success {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 10px;
    }

    .btn-danger {
        background-color: #dc3545;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
    }

    .btn-success:hover {
        background-color: #218838;
    }

    .btn-danger:hover {
        background-color: #c82333;
    }

    /* Ocultar los botones de DataTables por defecto */
    .dt-buttons {
        display: none;
    }
</style>
</body>
</html>
