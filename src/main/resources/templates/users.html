<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración de Usuarios – Sistema de Matrícula</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
  <div class="flex flex-col space-y-6">
    <!-- Título principal -->
    <div class="text-center">
      <h1 class="text-5xl font-bold text-gray-800 mb-2">Gestión de Usuarios</h1>
    </div>

    <!-- Botón "Nuevo Usuario" -->
    <div class="bg-white p-4 rounded-lg shadow border border-gray-200">
      <div class="flex justify-end">
        <button sec:authorize="hasRole('ADMIN')"
                class="px-6 py-2 bg-green-600 text-white rounded-lg shadow hover:bg-green-700 transition whitespace-nowrap flex items-center"
                data-modal-open="#modalUser">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
          </svg>
          Nuevo Usuario
        </button>
      </div>
    </div>

    <!-- TABLA DE USUARIOS -->
    <div class="bg-white shadow-lg rounded-xl overflow-hidden border border-gray-200">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Correo</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rol</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha Registro</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha Conexión</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
          </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
          <tr th:each="usr : ${users.content}" class="hover:bg-gray-50 transition duration-150 ease-in-out">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${usr.userId}">userId</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${usr.userEmail}">email</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${usr.role.name}">ROLE</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
                th:text="${#temporals.format(usr.fechaRegistro, 'dd/MM/yyyy HH:mm')}">fechaReg</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
                th:text="${#temporals.format(usr.fechaConexion, 'dd/MM/yyyy HH:mm')}">fechaCon</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex items-center space-x-2">
                <button sec:authorize="hasAnyRole('ADMIN','GENERAL')"
                        type="button"
                        class="inline-flex items-center px-3 py-1.5 border border-yellow-500 shadow-sm text-xs font-medium rounded-md text-yellow-700 bg-white hover:bg-yellow-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500"
                        data-modal-open="#modalUser"
                        th:data-userid="${usr.userId}"
                        th:data-useremail="${usr.userEmail}"
                        th:data-role="${usr.role.name}"
                        onclick="openUserModal(this)">
                  Editar
                </button>
                <form sec:authorize="hasAnyRole('ADMIN','GENERAL')"
                      th:action="@{/config/users/delete/{id}(id=${usr.userId})}"
                      method="post"
                      onsubmit="return confirm('¿Eliminar usuario?');"
                      class="inline">
                  <button type="submit"
                          class="inline-flex items-center px-3 py-1.5 border border-red-500 shadow-sm text-xs font-medium rounded-md text-red-700 bg-white hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                    Eliminar
                  </button>
                </form>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- PAGINACIÓN -->
    <div class="flex items-center">
      <div class="mr-auto">
        <a th:href="@{/inicio}" class="px-4 py-2 bg-gray-500 text-white rounded-lg shadow hover:bg-gray-600 transition flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Atrás
        </a>
      </div>

      <div class="absolute left-1/2 transform -translate-x-1/2">
        <nav class="inline-flex rounded-md shadow-sm -space-x-px">
          <ul class="inline-flex -space-x-px text-sm">
            <li th:if="${users.hasPrevious()}">
              <a th:href="@{/config/users(page=${users.number - 1})}"
                 class="px-3 py-2 ml-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100 hover:text-gray-700">
                Anterior
              </a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">
              <a th:href="@{/config/users(page=${i})}"
                 th:classappend="${i == users.number} ? 'text-blue-600 bg-blue-100 hover:bg-blue-200 hover:text-blue-700' : 'text-gray-500 bg-white hover:bg-gray-100 hover:text-gray-700'"
                 class="px-3 py-2 leading-tight border border-gray-300">
                <span th:text="${i + 1}"></span>
              </a>
            </li>
            <li th:if="${users.hasNext()}">
              <a th:href="@{/config/users(page=${users.number + 1})}"
                 class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100 hover:text-gray-700">
                Siguiente
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>

<!-- MODAL CREAR / EDITAR USUARIO -->
<div id="modalUser" class="fixed inset-0 flex items-center justify-center bg-black/50 hidden z-50 overflow-y-auto">
  <div class="bg-white rounded-lg shadow-lg w-11/12 md:w-3/4 lg:w-2/3 xl:w-1/2 p-6 relative my-8 max-h-[90vh] overflow-y-auto">
    <h2 class="text-xl font-bold mb-4" th:text="${newUser.userId} != null ? 'Editar Usuario' : 'Crear Usuario'">Crear Usuario</h2>

    <form th:action="@{/config/users}" th:object="${newUser}" method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700" for="userId">ID de usuario</label>
        <input type="text"
               id="userId"
               th:field="*{userId}"
               th:readonly="${newUser.userId} != null"
               placeholder="Usuario123"
               required
               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700" for="userEmail">Correo</label>
        <input type="email"
               id="userEmail"
               th:field="*{userEmail}"
               placeholder="usuario@entidad.com"
               required
               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700" for="userPassword">Contraseña</label>
        <input type="password"
               id="userPassword"
               th:field="*{userPassword}"
               placeholder="••••••••"
               th:attr="required=${newUser.userId} == null"
               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
        <small th:if="${newUser.userId} != null" class="text-sm text-gray-600">
          (Déjalo vacío para no cambiarla)
        </small>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700" for="selectedRole">Rol</label>
        <select id="selectedRole"
                name="selectedRole"
                required
                class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
          <option th:each="role : ${roles}"
                  th:value="${role.name}"
                  th:text="${role.name}"
                  th:selected="${newUser.role != null} ? ${newUser.role.name == role.name} : false">
          </option>
        </select>
      </div>

      <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200">
        <button type="submit"
                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition"
                th:text="${newUser.userId} != null ? 'Actualizar' : 'Crear'">
          Crear
        </button>
        <button type="button"
                class="px-4 py-2 bg-gray-400 text-white rounded-md hover:bg-gray-500 transition"
                data-modal-close="#modalUser">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>

<script th:src="@{/js/modal.js}"></script>
</body>
</html>
