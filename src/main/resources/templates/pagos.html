<!-- pagos.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Pagos - Finanzas</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="mx-auto max-w-7xl px-4 py-6">
<div class="flex items-center space-x-4 mb-6">
  <a th:href="@{/finanzas}" class="px-4 py-2 bg-gray-500 text-white rounded-lg">
    ← Volver a Finanzas
  </a>
  <h1 class="text-3xl font-bold">Gestión de Pagos</h1>
</div>

<!-- Filtro por DNI -->
<div class="bg-white p-4 rounded-lg shadow border border-gray-200 mb-6">
  <form method="get" th:action="@{/pagos}" class="flex space-x-4">
    <div>
      <label class="block text-sm">DNI Alumno</label>
      <input name="dniAlum" th:value="${param.dniAlum}" placeholder="Filtrar por DNI"
             class="px-3 py-2 border rounded"/>
    </div>
    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
      Buscar
    </button>
  </form>
</div>

<!-- Tabla de Pagos -->
<div class="bg-white shadow rounded overflow-x-auto">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50 text-xs uppercase text-gray-500">
    <tr>
      <th class="px-4 py-2">ID Pago</th>
      <th class="px-4 py-2">Cuota</th>
      <th class="px-4 py-2">Alumno</th>
      <th class="px-4 py-2">Voucher</th>
      <th class="px-4 py-2">Fecha</th>
      <th class="px-4 py-2">Usuario</th>
    </tr>
    </thead>
    <tbody class="divide-y divide-gray-200 text-sm">
    <tr th:each="p : ${pagos.content}">
      <td class="px-4 py-2" th:text="${p.id}"></td>
      <td class="px-4 py-2" th:text="${p.cuota.id}"></td>
      <td class="px-4 py-2" th:text="${p.cuota.alumno.dniAlum}"></td>
      <td class="px-4 py-2" th:text="${p.codigoOperacion}"></td>
      <td class="px-4 py-2" th:text="${#temporals.format(p.fechaRegistro,'dd/MM/yyyy')}"></td>
      <td class="px-4 py-2" th:text="${p.usuarioRegistro}"></td>
    </tr>
    </tbody>
  </table>
  <div class="p-4">
    <span th:text="'Página ' + ${pagos.number + 1} + ' de ' + ${pagos.totalPages}"></span>
  </div>
</div>
</body>
</html>
